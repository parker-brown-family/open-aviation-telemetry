server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    # index.html must not be, or a deploy leaves clients on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API is reverse-proxied under the same origin, so the browser never
    # makes a cross-origin request and CORS is not part of the deployment.
    location /api/ {
        proxy_pass http://telemetry-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://telemetry-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single-page application: any unmatched path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
