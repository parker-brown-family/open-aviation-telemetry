name: CI

# Runs on every pull request and on main. The job order matters: the cheap
# checks that catch most mistakes run first and independently, and the expensive
# end-to-end job only runs once the code compiles and the unit tests pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same branch. Nobody needs the
  # result of a build for code that has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck every package
        run: pnpm -r --filter "./packages/*" typecheck

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the test suites
        run: pnpm vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile every package
        run: pnpm -r --filter "./packages/*" build

      - name: Build the web client
        run: pnpm --filter @oat/web build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false initialises providers and modules without needing state
      # or AWS credentials, which is all `validate` requires.
      - name: Validate the demo environment
        working-directory: infra/terraform/environments/demo
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Lint the chart
        run: helm lint charts/open-aviation-telemetry

      - name: Render with defaults
        run: helm template oat charts/open-aviation-telemetry --namespace aviation > /dev/null

      # The production-shaped path exercises the ingress, the MSK auth mode and
      # the simulator, none of which the default values render.
      - name: Render with ingress, MSK auth and the simulator
        run: |
          helm template oat charts/open-aviation-telemetry \
            --namespace aviation \
            --set ingress.enabled=true \
            --set ingress.host=telemetry.example.com \
            --set kafka.auth=aws-msk-iam \
            --set workloads.simulator.enabled=true \
            --set image.tag=${GITHUB_SHA::7} > /dev/null

      # Rendering without error is not the same as rendering correctly, and the
      # listener annotations are a case where the difference costs an afternoon:
      # an HTTPS listener with no certificate makes the AWS Load Balancer
      # Controller reject the Ingress outright, so no load balancer is created
      # and the only symptom is an address that never arrives.
      - name: An ingress without a certificate asks for HTTP only
        run: |
          set -euo pipefail
          out=$(helm template oat charts/open-aviation-telemetry \
            --namespace aviation --set ingress.enabled=true)

          echo "$out" | grep -q 'listen-ports: .\[{"HTTP": 80}\]' \
            || { echo 'expected an HTTP-only listener set'; exit 1; }
          if echo "$out" | grep -q 'ssl-redirect'; then
            echo 'ssl-redirect must not be set without a certificate'; exit 1
          fi
          if echo "$out" | grep -q 'HTTPS'; then
            echo 'an HTTPS listener was declared with no certificate-arn'; exit 1
          fi

      - name: An ingress with a certificate asks for HTTPS and redirects to it
        run: |
          set -euo pipefail
          out=$(helm template oat charts/open-aviation-telemetry \
            --namespace aviation --set ingress.enabled=true \
            --set ingress.certificateArn=arn:aws:acm:ca-central-1:000000000000:certificate/test)

          echo "$out" | grep -q 'certificate-arn: "arn:aws:acm:' \
            || { echo 'the certificate arn was not passed through'; exit 1; }
          echo "$out" | grep -q 'listen-ports: .\[{"HTTP": 80}, {"HTTPS": 443}\]' \
            || { echo 'expected both listeners'; exit 1; }
          echo "$out" | grep -q 'ssl-redirect: "443"' \
            || { echo 'expected the redirect to the HTTPS listener'; exit 1; }

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Pushing writes packages under this repository; a pull request from a fork
    # must not be able to do that, so the token is only widened on main.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - telemetry-api
          - telemetry-consumer
          - report-worker
          - simulator
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # On a pull request the image is built and thrown away: the point is that
      # the Dockerfile still compiles. On main it is published, because a chart
      # whose default registry holds nothing cannot be installed by anyone
      # reading the README — including us, on a cluster we are paying for.
      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PACKAGE=@oat/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          # Both tags on purpose. The SHA is what a deploy pins — `latest` is
          # never deployed (see charts/.../values.yaml) — and the moving tag
          # exists only so a reader can pull one without looking up a commit.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  web-image:
    name: Web image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  e2e:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    needs: [lint, test]
    # The only job that proves the architecture rather than the code: it brings
    # up PostgreSQL, Kafka, RabbitMQ and all four services, then asserts that a
    # telemetry report really does cross the broker and reach the database.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/ready > /dev/null 2>&1; then
              echo "ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready"
          curl -s http://localhost:8080/ready || true
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: End-to-end suite
        run: pnpm vitest run --config tests/e2e/vitest.config.ts
        env:
          E2E_BASE_URL: http://localhost:8080

      # Logs are the only way to diagnose a failure in a stack that no longer
      # exists, so they are captured on failure rather than after teardown.
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
