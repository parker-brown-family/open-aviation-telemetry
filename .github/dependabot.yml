version: 2

# Grouped and weekly rather than per-package and daily. A stream of individual
# bumps gets ignored, which is the same as not having Dependabot at all.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories:
      - /
      - /packages/web
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/demo
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    labels: [dependencies, infrastructure]
